# One platform, and expect close to nothing from it.
#
# A Sponsor button on a library like this is not an income stream -- research-adjacent software gets
# funded by grants, not by donations, and the honest forecast for a solo project of this shape is a
# handful of small sponsors at most. What the button is genuinely for is being a **door**: it tells a
# company already depending on the library that there is a way to pay, and that occasionally turns into
# a conversation worth far more than the button collects.
#
# So: enable one, set expectations, and put the effort that would have gone into a second platform into
# the thing that actually funds work like this -- a citable paper. `CITATION.cff` is already here and
# Zenodo is switched on; a software paper (JOSS, SoftwareX, Computer Physics Communications) turns this
# into something a grant application can cite.
#
# A key with an empty or placeholder value renders a button that goes nowhere, which is worse than no
# button -- the same failure as an invalid ORCID rendering no citation at all.
#
# The licence has no opinion about any of this. `MIT OR Apache-2.0` says nothing about money, and
# accepting support for open-source work is compatible with both.

# GitHub Sponsors -- the recommended one, and the only one recommended.
#
# No platform fee, it sits where the code is, and one platform is one set of tax records instead of
# three. Enrolment needs a payout account through Stripe Connect, whose supported regions change, so
# check the current list rather than assuming.
#
# Enrol first at github.com/sponsors, then uncomment. Enabling the key before enrolling renders a
# button that leads to a page saying sponsorships are not accepted, which is the failure described
# above rather than a head start on it.
# github: YounghyeonPark

# PAYOUT ROUTE: a bank account through Stripe Connect, not a fiscal host.
#
# A fiscal host sells exactly one thing a solo project cannot get otherwise -- it is a legal entity, so
# it can invoice a company, issue a receipt, and survive a procurement process that will not send money
# to an individual. That is worth roughly ten percent of everything plus an expense-claim workflow and
# public books on every transaction.
#
# None of which is needed until a company is actually on the other end of the conversation, and it is
# not a one-way door: moving to a host later is possible, and at that point the reason for it exists
# rather than being anticipated. Paying now buys an option that may never be exercised, and the
# overhead is the same whether the account holds nothing or something.
#
# The fiscal-host choice is also an organization-account feature; a personal account may not be
# offered it at all, in which case there is no decision to make.


# Deliberately not enabled, rather than not considered:
#
#   ko_fi / buy_me_a_coffee   reach further with less setup, and take a cut. Worth adding only if
#                             somebody says they could not use Sponsors.
#   liberapay                 no fee, very little reach.
#   open_collective           a shared account with public books and a fiscal-host fee. The right
#                             shape when there is more than one maintainer, and there is not.
#
# Every extra platform is another account, another payout, another line in a tax return, for the same
# near-zero. Add one when a would-be sponsor is actually blocked.
#
# ko_fi: yourname
# buy_me_a_coffee: yourname
# liberapay: yourname
# open_collective: dualis
# custom: ["https://..."]

# --- Two things worth deciding before switching one on ------------------------------------------
#
# WHAT THE MONEY BUYS, said out loud. A Sponsor button implies support without defining it, and the
# implication is what causes friction: somebody who has given money reasonably expects their issue to
# come first. If that is not the arrangement, say so where the button is -- "this supports the work
# and buys no priority, no support commitment and no promise of a feature" costs one line and prevents
# the whole misunderstanding.
#
# WHERE THE MONEY GOES. Donations are income in most tax systems rather than gifts, so whichever
# platform is chosen has reporting attached to it. Worth settling before a button is switched on rather
# than at the end of a tax year.

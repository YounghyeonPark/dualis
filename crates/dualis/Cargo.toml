[package]
name = "dualis"
description = "Physics for simulated worlds: units, kernel, ten domains and a scene layer in one dependency"
keywords = ["physics", "simulation", "optics", "thermal", "multiphysics"]
categories = ["science", "simulation"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dualis-acoustic = { workspace = true }
dualis-core = { workspace = true }
dualis-elastic = { workspace = true }
dualis-em = { workspace = true }
dualis-fluid = { workspace = true }
dualis-mechanics = { workspace = true }
dualis-molecular = { workspace = true }
dualis-electrical = { workspace = true }
dualis-optics = { workspace = true }
dualis-porous = { workspace = true }
dualis-quantum = { workspace = true }
dualis-scene = { workspace = true }
dualis-shape = { workspace = true }
dualis-view = { workspace = true }
dualis-thermal = { workspace = true }
dualis-units = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
# Tests only. A consumer of `dualis` never resolves this, so the twelve-crate
# count the README states is unaffected; `dualis-core` already dev-depends on it.
serde_json = { workspace = true }

[package]
name = "pantometry"
description = "Physics for simulated worlds: units, kernel, eleven domains and a scene layer in one dependency"
keywords = ["physics", "simulation", "optics", "thermal", "multiphysics"]
categories = ["science", "simulation"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
pantometry-acoustic = { workspace = true }
pantometry-core = { workspace = true }
pantometry-elastic = { workspace = true }
pantometry-em = { workspace = true }
pantometry-fluid = { workspace = true }
pantometry-mechanics = { workspace = true }
pantometry-molecular = { workspace = true }
pantometry-electrical = { workspace = true }
pantometry-optics = { workspace = true }
pantometry-porous = { workspace = true }
pantometry-quantum = { workspace = true }
pantometry-scene = { workspace = true }
pantometry-shape = { workspace = true }
pantometry-view = { workspace = true }
pantometry-thermal = { workspace = true }
pantometry-units = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
# Tests only. A consumer of `pantometry` never resolves this, so the twelve-crate
# count the README states is unaffected; `pantometry-core` already dev-depends on it.
serde_json = { workspace = true }

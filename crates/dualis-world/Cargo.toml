[package]
name = "dualis-world"
description = "The first consumer of the dualis SDK: scenes described as data, run and drawn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# An application, not a library on the registry. It is here to exercise the SDK from the
# outside, and shipping it to crates.io would say something about it that is not true.
publish = false

[dependencies]
dualis = { workspace = true }
# For the vector constructors the mechanics domains take, and for the molecular crate's
# reduced-unit helpers, which the facade does not re-export.
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }


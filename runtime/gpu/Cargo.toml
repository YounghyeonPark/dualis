# A **separate cargo workspace**, excluded from the library's, for two reasons.
#
# The dependency one, measured: the library resolves 12 external crates and a wgpu stack is 86.
#
# And one that is not about dependencies. WGSL has no `f64`, so a compute kernel is a *different
# computation* from the `f64` domain it accelerates — not a faster one. That is a claim the
# library must not make on its own behalf, and this crate exists to measure how far apart the two
# actually land.
[package]
name = "pantometry-gpu"
description = "An accelerator for pantometry's explicit stencils, with the CPU domain as the reference"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
pantometry-core = { path = "../../crates/pantometry-core" }
pantometry-thermal = { path = "../../crates/pantometry-thermal" }
pollster = "0.4"
wgpu = "22"

[dev-dependencies]
pantometry-units = { path = "../../crates/pantometry-units" }

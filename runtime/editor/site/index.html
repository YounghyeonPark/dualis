<!doctype html>
<meta charset="utf-8">
<title>dualis — a scene, in a browser</title>
<style>
  :root { color-scheme: dark; --bg:#14171c; --pane:#1b1f26; --line:#2b313b; --ink:#d6dae2;
          --dim:#8b95a3; --bad:#e0665f; --note:#e6b43c; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-rows:auto 1fr auto;
         background:var(--bg); color:var(--ink);
         font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header, footer { padding:6px 10px; background:var(--pane); border-color:var(--line);
                   display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  footer { border-top:1px solid var(--line); min-height:30px; }
  button, label.file { background:#252b34; color:var(--ink); border:1px solid var(--line);
                       border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.45; cursor:default; }
  button:hover:not(:disabled), label.file:hover { background:#2f3742; }
  main { display:grid; grid-template-columns:minmax(280px,34%) 1fr; min-height:0; }
  #text { background:var(--pane); color:var(--ink); border:0; border-right:1px solid var(--line);
          padding:10px; resize:none; font:12px/1.5 ui-monospace,"Cascadia Code",monospace;
          outline:none; }
  #view { position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  #overlay { position:absolute; inset:0; pointer-events:none; padding:10px;
             display:flex; flex-direction:column; justify-content:space-between; }
  #readings { align-self:flex-end; text-align:right; font:11px/1.5 ui-monospace,monospace;
              color:var(--dim); white-space:pre; }
  #notes { color:var(--note); font-size:11px; }
  #status { flex:1; }
  #status.bad { color:var(--bad); }
  #report { position:absolute; inset:14px; background:#0f1216ee; border:1px solid var(--line);
            border-radius:6px; padding:12px; overflow:auto; white-space:pre;
            font:11px/1.45 ui-monospace,monospace; display:none; }
  #report.open { display:block; }
  input[type=range] { width:220px; }
  .sp { flex:1; }
</style>

<header>
  <label class="file">open<input id="open" type="file" accept=".json" hidden></label>
  <label class="file">add CAD<input id="cad" type="file" accept=".stl" multiple hidden></label>
  <button id="fitgrid" disabled>fit grid</button>
  <button id="assemble" disabled>assemble</button>
  <button id="save">save</button>
  <button id="run">run</button>
  <button id="verify">verify</button>
  <label><input id="deep" type="checkbox"> deep</label>
  <button id="fit">fit view</button>
  <span class="sp"></span>
  <button id="play">play</button>
  <input id="frame" type="range" min="0" max="0" value="0" disabled>
  <span id="clock" style="color:var(--dim);font:11px ui-monospace,monospace">t = —</span>
</header>

<main>
  <textarea id="text" spellcheck="false"></textarea>
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div><div id="summary" style="color:var(--dim)"></div><div id="notes"></div></div>
      <div id="readings"></div>
    </div>
    <div id="report"></div>
  </div>
</main>

<div id="tagging" hidden style="padding:8px 14px;border-top:1px solid #26303c;background:#0c1117;font:11px ui-monospace,Consolas,monospace;color:#cbd5e1">
  <div style="color:#7f8b9a;margin-bottom:6px">what each part is made of</div>
  <div id="taglist"></div>
</div>
<pre id="fitout" hidden style="margin:0;padding:10px 14px;overflow:auto;max-height:44vh;border-top:1px solid #26303c;background:#0c1117;color:#cbd5e1;font:11px/1.45 ui-monospace,Consolas,monospace;white-space:pre"></pre>
<footer><span id="status">loading the physics…</span><span class="sp"></span><span id="parts" style="color:var(--dim);font:11px ui-monospace,monospace">no CAD uploaded</span></footer>

<script type="module">
// The page paints and decides nothing. Every geometric and physical decision — what a scene
// means, where a domain sits, what colour a temperature is — is made inside the wasm module by
// the same code the native editor calls. This file is a canvas, a text box and an event loop.

const DEFAULT_SCENE = `{
  "title": "a block hot enough to glow",
  "duration_s": 2.0,
  "frames": 20,
  "domains": [
    { "kind": "block", "name": "block", "cells": [8, 8, 8], "cell_mm": 5.0,
      "initial_c": 1200.0,
      "hot_spot": { "at": [4, 4, 4], "above_k": 400.0 } }
  ]
}
`;

const $ = id => document.getElementById(id);
const status = (msg, bad = false) => { $('status').textContent = msg; $('status').classList.toggle('bad', bad); };

let wasm, mem;

// --- the boundary: text in, length-prefixed text out ---------------------------------------
const enc = new TextEncoder(), dec = new TextDecoder();

function put(str) {
  const bytes = enc.encode(str);
  const ptr = wasm.dualis_alloc(bytes.length);
  new Uint8Array(mem.buffer, ptr, bytes.length).set(bytes);
  return [ptr, bytes.length];
}

function take(ptr) {
  // Four little-endian bytes of length, then that many bytes of UTF-8.
  const len = new DataView(mem.buffer).getUint32(ptr, true);
  const body = dec.decode(new Uint8Array(mem.buffer, ptr + 4, len));
  wasm.dualis_free(ptr, len + 4);
  return JSON.parse(body);
}

function call(fn, str) {
  if (str === undefined) return take(fn());
  const [ptr, len] = put(str);
  const out = take(fn(ptr, len));
  wasm.dualis_free(ptr, len);
  return out;
}

// A part is a name and its bytes, and the bytes are not text — an STL is binary and encoding it
// as UTF-8 would corrupt every float in it. Two buffers, both freed here.
function putBytes(u8) {
  const ptr = wasm.dualis_alloc(u8.length);
  new Uint8Array(mem.buffer, ptr, u8.length).set(u8);
  return [ptr, u8.length];
}

function sendPart(name, u8) {
  const [np, nl] = put(name);
  const [dp, dl] = putBytes(u8);
  const out = take(wasm.dualis_part(np, nl, dp, dl));
  wasm.dualis_free(np, nl);
  wasm.dualis_free(dp, dl);
  return out;
}

// --- state ----------------------------------------------------------------------------------
const cam = { azimuth: 0.7, elevation: 0.4, distance: 2.5, scale: 1.0 };
let frames = 0, playing = false, needsFit = true, lastDraw = null;

// --- drawing ---------------------------------------------------------------------------------
const canvas = $('canvas'), ctx = canvas.getContext('2d');

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = Math.max(1, r.width * dpr);
  canvas.height = Math.max(1, r.height * dpr);
  draw();
}
addEventListener('resize', resize);

function draw() {
  if (!wasm) return;
  const w = canvas.width, h = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#101318';
  ctx.fillRect(0, 0, w, h);

  const out = call(wasm.dualis_draw, JSON.stringify({
    ...cam, aspect: w / Math.max(1, h), frame: +$('frame').value, fit: needsFit,
  }));
  needsFit = false;
  lastDraw = out;

  if (out.empty) {
    ctx.fillStyle = '#8b95a3';
    ctx.font = `${14 * (devicePixelRatio || 1)}px ui-sans-serif, system-ui`;
    ctx.textAlign = 'center';
    wrap(out.empty, w / 2, h / 2, w * 0.7);
    $('readings').textContent = '';
    $('notes').textContent = '';
    return;
  }
  if (out.error) { status(out.error, true); return; }

  // The projection hands back normalised units, -1..1 across the shorter side, and the page
  // maps them exactly as the native shell does.
  Object.assign(cam, out.camera);
  const cx = w / 2, cy = h / 2;
  const X = x => cx + x * w / 2, Y = y => cy - y * h / 2;
  const R = r => r * Math.min(w, h) / 2;

  for (const [x1, y1, x2, y2, colour, width] of out.lines) {
    ctx.strokeStyle = colour;
    ctx.lineWidth = width * (devicePixelRatio || 1);
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
  }
  for (const [x, y, r, colour] of out.dots) {
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.arc(X(x), Y(y), Math.max(1, R(r)), 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = '#d6dae2';
  ctx.font = `${12 * (devicePixelRatio || 1)}px ui-sans-serif, system-ui`;
  ctx.textAlign = 'left';
  for (const [x, y, name] of out.labels) ctx.fillText(name, X(x) + 4, Y(y) - 4);

  $('notes').textContent = (out.notes || []).join('\n');
  $('readings').textContent = (out.readings || [])
    .map(r => `${r.domain}  ${r.label}  ${r.value.toFixed(4)} ${r.unit}`).join('\n');
  $('clock').textContent = frames ? `t = ${out.t.toFixed(4)} s` : 't = —';
}

function wrap(text, x, y, max) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > max && line) { lines.push(line); line = word; }
    else line = test;
  }
  lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, x, y + (i - lines.length / 2) * 20));
}

// --- interaction -------------------------------------------------------------------------------
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', e => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  cam.azimuth += (e.clientX - lastX) * 0.01;
  cam.elevation = Math.max(-1.5, Math.min(1.5, cam.elevation + (e.clientY - lastY) * 0.01));
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.distance = Math.max(1.2, Math.min(9.0, cam.distance * Math.pow(0.999, -e.deltaY * 3)));
  draw();
}, { passive: false });

// --- the scene text ----------------------------------------------------------------------------
let checkTimer = null;
function recheck() {
  const out = call(wasm.dualis_check, $('text').value);
  $('summary').textContent = out.summary || '';
  const notes = out.notes || [];
  $('notes').textContent = notes.join('\n');
  if (out.error) { status(out.error, true); }
  else { status(notes.length ? notes[0] : 'checked'); }
  $('run').disabled = !!out.error;
  $('verify').disabled = !!out.error;
  frames = 0;
  $('frame').max = 0; $('frame').value = 0; $('frame').disabled = true;
  draw();
}
$('text').addEventListener('input', () => {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(recheck, 180);   // debounced: a keystroke should not build a world
});

$('run').onclick = () => {
  status('running…');
  // Yielding first so the status paints: the run is synchronous inside wasm, as it is in the
  // CLI, and a page that never repaints looks hung rather than busy.
  setTimeout(() => {
    const out = take(wasm.dualis_run());
    if (out.error) { status(out.error, true); frames = 0; $('frame').disabled = true; draw(); return; }
    frames = out.frames;
    $('frame').max = Math.max(0, frames - 1);
    $('frame').value = Math.max(0, frames - 1);
    $('frame').disabled = frames < 2;
    needsFit = true;
    status(`ran: ${frames} frames`);
    draw();
  }, 0);
};

$('verify').onclick = () => {
  status('verifying…');
  setTimeout(() => {
    const res = take(wasm.dualis_verify($('deep').checked ? 1 : 0));
    const r = res.error ? { report: res.error, findings: 1 } : res;
    $('report').textContent = r.report;
    $('report').classList.add('open');
    status(r.findings ? `verify: ${r.findings} finding(s)` : 'verified: no structural findings',
           !!r.findings);
  }, 0);
};
$('report').onclick = () => $('report').classList.remove('open');

$('fit').onclick = () => { needsFit = true; draw(); };
$('frame').oninput = draw;
$('play').onclick = () => {
  playing = !playing;
  $('play').textContent = playing ? 'pause' : 'play';
  const tick = () => {
    if (!playing || frames < 2) return;
    const f = $('frame');
    f.value = (+f.value + 1) % frames;
    draw();
    setTimeout(tick, 60);
  };
  tick();
};

$('open').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('text').value = await file.text();
  recheck();
  needsFit = true;
  draw();
  status(`opened ${file.name}`);
};
// --- CAD -------------------------------------------------------------------------------------
// The bytes go to the module and stay there. Nothing is uploaded anywhere: this page has no
// server, the physics is a wasm module in the tab, and a scene that says `"stl": "bracket.stl"`
// finds it because a file called that was handed over here.
// What each uploaded file is made of, by name. A part with nothing chosen is aluminium, which is
// what a `block` defaults to — so the list starts usable and a user changes what they care about.
const tags = {};
let catalogue = ['aluminium'];

function showTagging(names) {
  const box = $('taglist');
  box.innerHTML = '';
  for (const n of names) {
    if (!(n in tags)) tags[n] = 'aluminium';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin:2px 0';
    const label = document.createElement('span');
    label.textContent = n;
    label.style.cssText = 'min-width:16ch;color:#cbd5e1';
    const pick = document.createElement('select');
    for (const m of catalogue) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      if (m === tags[n]) o.selected = true;
      pick.appendChild(o);
    }
    pick.onchange = () => { tags[n] = pick.value; };
    const drop = document.createElement('button');
    drop.textContent = 'remove';
    drop.onclick = () => { showParts(forgetPart(n)); };
    row.append(label, pick, drop);
    box.appendChild(row);
  }
  $('tagging').hidden = names.length === 0;
}

function forgetPart(name) {
  const [p, l] = put(name);
  const out = take(wasm.dualis_forget_part(p, l));
  wasm.dualis_free(p, l);
  delete tags[name];
  return out;
}

// **assemble** is the step the format could describe and the page could not do: it takes the grid
// the fitter measured, the material each file was tagged with, and writes the `block` domain that
// puts them on one mesh. Everything outside the parts becomes void, which is what an assembly in
// air is — so the scene it writes is the one a user would have had to hand-compose from the table.
$('assemble').onclick = () => {
  status('measuring a grid for these parts…');
  const [mp, ml] = put('aluminium');
  const out = take(wasm.dualis_fit(2000000, mp, ml));
  wasm.dualis_free(mp, ml);
  if (out.error) { status(out.error, true); return; }
  if (!out.fragment) {
    status('no grid holds every part under half boundary — press fit grid and read the table', true);
    return;
  }
  const names = Object.keys(tags).sort();
  const parts = names.map(n => `      { "stl": ${JSON.stringify(n)}, "material": ${JSON.stringify(tags[n])} }`);
  const scene = {
    title: `an assembly of ${names.length} part(s)`,
    duration_s: 60.0,
    frames: 20,
    domains: [],
  };
  const head = JSON.stringify(scene, null, 2).replace(/"domains": \[\]/,
    '"domains": [\n    {\n      "kind": "block", "name": "assembly",\n' +
    `      "cells": [${out.cells.join(', ')}],\n` +
    `      "cell_mm": ${out.cell_mm.toFixed(4)},\n` +
    '      "initial_c": 20.0,\n' +
    '      "parts": [\n' + parts.join(',\n') + '\n      ]\n    }\n  ]');
  $('text').value = head;
  recheck();
  needsFit = true;
  draw();
  status(`assembled ${names.length} part(s) on a ${out.cells.join(' x ')} grid at ${out.cell_mm.toFixed(3)} mm`);
};

function showParts(out) {
  if (out.error) { status(out.error, true); return; }
  const n = out.names.length;
  $('parts').textContent = n
    ? `${n} part file(s): ${out.names.join(', ')} — ${(out.bytes / 1024).toFixed(0)} kB`
    : 'no CAD uploaded';
  showTagging(out.names || []);
  $('fitgrid').disabled = n === 0;
  $('assemble').disabled = n === 0;
}

// **fit grid** answers the question a scene cannot: what `cells` and `cell_mm` hold these parts.
// Every row was rasterised rather than predicted — a part finer than the grid does not fail, it
// disappears — so the table is measurements and the only judgement is which row to recommend.
$('fitgrid').onclick = () => {
  status('rasterising every candidate grid…');
  const [mp, ml] = put('aluminium');
  const out = take(wasm.dualis_fit(2000000, mp, ml));
  wasm.dualis_free(mp, ml);
  if (out.error) { status(out.error, true); return; }
  const box = $('fitout');
  box.textContent = out.table + (out.fragment
    ? `\n\n  paste this into a "block" domain:\n\n${out.fragment}\n`
    : `\n  no grid holds every part under half its volume in boundary cells. The parts
  have detail this grid cannot carry, so refine by hand from the table above.\n`);
  box.hidden = false;
  status(out.fragment
    ? `a ${out.cells.join(' x ')} grid at ${out.cell_mm.toFixed(3)} mm holds every part`
    : 'no row qualified; the table says why');
};

async function addCad(files) {
  let last = null;
  for (const file of files) {
    const buf = new Uint8Array(await file.arrayBuffer());
    last = sendPart(file.name, buf);
    if (last.error) break;
  }
  if (last) showParts(last);
  if (last && !last.error) {
    status(`${files.length} file(s) ready — name them in the scene's \`parts\``);
    // A part that is now present may make a scene that was refused build, so re-check.
    recheck();
    draw();
  }
}

$('cad').onchange = e => { addCad(e.target.files); e.target.value = ''; };

// Dropping is what somebody with a CAD export in a folder actually does. A `.json` dropped here
// is a scene and anything else is a part, because guessing wrong about which is which is worse
// than having two ways in.
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  const all = [...e.dataTransfer.files];
  const scenes = all.filter(f => f.name.toLowerCase().endsWith('.json'));
  const parts = all.filter(f => !f.name.toLowerCase().endsWith('.json'));
  if (parts.length) await addCad(parts);
  if (scenes.length) {
    $('text').value = await scenes[0].text();
    recheck();
    needsFit = true;
    draw();
    status(`opened ${scenes[0].name}`);
  }
});

$('save').onclick = () => {
  const blob = new Blob([$('text').value], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scene.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

// --- boot ---------------------------------------------------------------------------------------
(async () => {
  try {
    const res = await WebAssembly.instantiateStreaming(fetch('editor_wasm.wasm'), {});
    wasm = res.instance.exports;
    mem = wasm.memory;
    // The material menu comes from the library, not from a list typed here: a copy drifts, and
    // the failure is a dropdown offering something the builder then refuses.
    catalogue = take(wasm.dualis_materials()).materials;
  } catch (e) {
    status(`could not load editor_wasm.wasm: ${e}. Serve this directory over http — a file:// \
page cannot fetch wasm.`, true);
    return;
  }
  $('text').value = DEFAULT_SCENE;
  resize();
  recheck();
  status('ready — the physics is running in this tab, with no server');
})();
</script>

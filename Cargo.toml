[workspace]
members = [
    "crates/dualis-units",
    "crates/dualis-core",
    "crates/dualis-optics",
    "crates/dualis-thermal",
    "crates/dualis-mechanics",
    "crates/dualis-acoustic",
    "crates/dualis-molecular",
    "crates/dualis",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Verified by the `msrv` CI job rather than guessed, and set by `Cargo.lock` being
# format version 4 rather than by anything in the source — see that job's comment.
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Younghyeon Park and dualis contributors"]
repository = "https://github.com/YounghyeonPark/dualis"

[workspace.dependencies]
dualis-units = { path = "crates/dualis-units", version = "0.1.0" }
dualis-core = { path = "crates/dualis-core", version = "0.1.0" }
dualis-optics = { path = "crates/dualis-optics", version = "0.1.0" }
dualis-thermal = { path = "crates/dualis-thermal", version = "0.1.0" }
dualis-mechanics = { path = "crates/dualis-mechanics", version = "0.1.0" }
dualis-acoustic = { path = "crates/dualis-acoustic", version = "0.1.0" }
dualis-molecular = { path = "crates/dualis-molecular", version = "0.1.0" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

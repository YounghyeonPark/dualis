[workspace]
members = ["crates/dualis-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Younghyeon Park and dualis contributors"]
repository = "https://github.com/YounghyeonPark/dualis-core"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
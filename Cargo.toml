[workspace]
members = [
    "crates/dualis-units",
    "crates/dualis-core",
    "crates/dualis-optics",
    "crates/dualis-thermal",
    "crates/dualis-mechanics",
    "crates/dualis-acoustic",
    "crates/dualis-molecular",
    "crates/dualis-electrical",
    "crates/dualis-porous",
    "crates/dualis-elastic",
    "crates/dualis-em",
    "crates/dualis-fluid",
    "crates/dualis-quantum",
    # Not a domain and not a layer: input preparation. It depends on `dualis-units` and nothing else
    # in the workspace, and no domain depends on it — it hands out a predicate and a domain's `fill`
    # takes one, which is the whole coupling.
    "crates/dualis-shape",
    "crates/dualis-scene",
    "crates/dualis-view",
    "crates/dualis",
    # The first consumer. Not published — it exists to find out where the SDK is awkward,
    # which is a question no test in the library can answer about itself.
    "crates/dualis-world",
]
exclude = [
    # Its own workspace: pyo3 brings fifteen crates and a libpython link, and the library's
    # lockfile, `deny.toml` allow-list and wasm jobs are promises that should not have to
    # accommodate a Python extension. See its Cargo.toml.
    "bindings/python",
    # And its own for the same reason, measured rather than assumed: pyo3 adds seven external
    # crates and that was enough to split it out. A GPU stack is far past that, and none of the
    # eleven published crates may carry it. See runtime/viewer/Cargo.toml.
    "runtime/viewer",
    # And the GPU accelerator, which is the same argument again plus one that is not about
    # dependencies at all: WGSL has no f64, so a compute kernel is a *different computation* from
    # the domain it accelerates. See runtime/gpu/README.md.
    "runtime/gpu",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
# Verified by the `msrv` CI job rather than guessed, and set by `Cargo.lock` being
# format version 4 rather than by anything in the source — see that job's comment.
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Younghyeon Park and dualis contributors"]
repository = "https://github.com/YounghyeonPark/dualis"

[workspace.dependencies]
dualis-units = { path = "crates/dualis-units", version = "0.14.0" }
dualis-core = { path = "crates/dualis-core", version = "0.14.0" }
dualis-optics = { path = "crates/dualis-optics", version = "0.14.0" }
dualis-thermal = { path = "crates/dualis-thermal", version = "0.14.0" }
dualis-mechanics = { path = "crates/dualis-mechanics", version = "0.14.0" }
dualis-acoustic = { path = "crates/dualis-acoustic", version = "0.14.0" }
dualis = { path = "crates/dualis", version = "0.14.0" }
dualis-molecular = { path = "crates/dualis-molecular", version = "0.14.0" }
dualis-electrical = { path = "crates/dualis-electrical", version = "0.14.0" }
dualis-porous = { path = "crates/dualis-porous", version = "0.14.0" }
dualis-elastic = { path = "crates/dualis-elastic", version = "0.14.0" }
dualis-em = { path = "crates/dualis-em", version = "0.14.0" }
dualis-fluid = { path = "crates/dualis-fluid", version = "0.14.0" }
dualis-quantum = { path = "crates/dualis-quantum", version = "0.14.0" }
dualis-shape = { path = "crates/dualis-shape", version = "0.14.0" }
dualis-scene = { path = "crates/dualis-scene", version = "0.14.0" }
dualis-view = { path = "crates/dualis-view", version = "0.14.0" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
